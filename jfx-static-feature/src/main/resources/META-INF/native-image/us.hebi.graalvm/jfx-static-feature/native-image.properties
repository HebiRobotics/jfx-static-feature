# The feature reaches into the image builder module. The driver applies these before it loads
# the feature, a jar's Add-Exports manifest attribute only counts for the -jar main jar.
# GraalVM 25.0 has no nativeimage.shared module and only warns about it.
Args = --features=us.hebi.graalvm.jfx.JfxStaticFeature \
       --add-opens=java.base/java.lang=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jdk=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jni=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jni.functions=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.jni.headers=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.util=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.c=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.c.codegen=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.image=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.shared/com.oracle.svm.shared.option=ALL-UNNAMED
