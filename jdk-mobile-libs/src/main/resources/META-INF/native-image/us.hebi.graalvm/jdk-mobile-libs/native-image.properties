# The feature unpacks the target's CAP cache into CAPCacheDir before the builder reads it, so no
# query program has to run on the target, and the archives into the lib directory beside it,
# where the builder checks for the JDK libraries. Both are relative to the working directory, a
# Maven build passes -H:CAPCacheDir=${project.build.directory}/jdk-mobile-libs/cap and
# -H:CLibraryPath=${project.build.directory}/jdk-mobile-libs/lib instead.
# Both targets use 16 KB pages (iOS, Android 15+), the default 64 KB alignment makes ld64 warn.
# The driver applies these before it loads the feature.
Args = --features=us.hebi.graalvm.mobile.JdkMobileFeature \
       -H:+UnlockExperimentalVMOptions \
       -H:+UseCAPCache \
       -H:PageSize=16384 \
       -H:CAPCacheDir=jdk-mobile-libs/cap \
       -H:CLibraryPath=jdk-mobile-libs/lib \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.core.util=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.builder/com.oracle.svm.hosted.c=ALL-UNNAMED \
       --add-exports=org.graalvm.nativeimage.shared/com.oracle.svm.shared.option=ALL-UNNAMED
