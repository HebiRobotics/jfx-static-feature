# Builds and runs the headless example on every platform. The windowed pipelines need a real
# session and stay a manual check.
name: render check

on:
  push:
  workflow_dispatch:
    inputs:
      sdk-url:
        description: Directory URL the openjfx-<version>-internal-static.zip archive is downloaded from
        required: false

env:
  # The ennerf/jfx archive is not on Central, so a run needs the FX_STATIC_SDK_URL variable or the dispatch input
  SDK_URL: ${{ github.event.inputs.sdk-url || vars.FX_STATIC_SDK_URL }}
  FX_VERSION: "26"

jobs:

  render-check:
    name: ${{ matrix.platform }} on GraalVM ${{ matrix.graalvm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            graalvm: "25"
          # One row on the previous minor, so a moved GraalVM internal shows up here first
          - os: windows-latest
            platform: windows-x86_64
            graalvm: "25.0"
          - os: ubuntu-latest
            platform: linux-x86_64
            graalvm: "25"
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            graalvm: "25"
          - os: macos-13
            platform: darwin-x86_64
            graalvm: "25"
          - os: macos-latest
            platform: darwin-aarch64
            graalvm: "25"
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.graalvm }}
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The feature links the whole GTK stack even for a headless render
      - name: install the link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: download the static SDK
        shell: bash
        run: |
          if [ -z "$SDK_URL" ]; then
            echo "Set the FX_STATIC_SDK_URL repository variable to the directory holding the ennerf/jfx static SDK archive"
            exit 1
          fi
          zip="openjfx-$FX_VERSION-internal-static.zip"
          curl -fsSL -o "jfx-static-libs/$zip" "$SDK_URL/$zip"

      - name: build the render check
        run: mvn -B -Pnative package -pl jfx-static-examples/example-headless -am

      - name: run the render check
        shell: bash
        run: |
          cd jfx-static-examples/example-headless/target
          ./render-check render-check.png

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check-${{ matrix.platform }}-graalvm${{ matrix.graalvm }}
          path: jfx-static-examples/example-headless/target/render-check.png
          if-no-files-found: warn

  # Headless loads no glass native, so one job runs the windowed app. Linux is the only runner with a display (Xvfb)
  gtk-window:
    name: hellofx on glassgtk3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install the link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: download the static SDK
        shell: bash
        run: |
          if [ -z "$SDK_URL" ]; then
            echo "Set the FX_STATIC_SDK_URL repository variable to the directory holding the ennerf/jfx static SDK archive"
            exit 1
          fi
          zip="openjfx-$FX_VERSION-internal-static.zip"
          curl -fsSL -o "jfx-static-libs/$zip" "$SDK_URL/$zip"

      - name: build hellofx
        run: mvn -B -Pnative package -pl jfx-static-examples/example-hellofx -am

      # The app runs until closed, the timeout is the success path
      - name: show the window
        run: |
          cd jfx-static-examples/example-hellofx/target
          timeout 30 xvfb-run -a ./hellofx -Dprism.verbose=true | tee hellofx.log || true
          grep "Initialized prism pipeline" hellofx.log
