# Builds and runs the headless example on every platform. The windowed pipelines need a real
# session and stay a manual check.
name: render check

on:
  push:
  workflow_dispatch:

jobs:

  render-check:
    name: ${{ matrix.platform }} on GraalVM ${{ matrix.graalvm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x86_64
            graalvm: "25"
          - os: windows-latest
            platform: windows-x86_64
            graalvm: "25"
          - os: ubuntu-latest
            platform: linux-x86_64
            graalvm: "25"
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
            graalvm: "25"
          - os: macos-15-intel
            platform: darwin-x86_64
            graalvm: "25.0.1" # last intel version, and checks for API compatibility
          - os: macos-latest
            platform: darwin-aarch64
            graalvm: "25"
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.graalvm }}
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The feature links the whole GTK stack even for a headless render
      - name: install the link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: build the render check
        run: mvn -B -Pnative package -pl jfx-static-examples/example-render-check -am

      - name: run the render check
        shell: bash
        run: |
          cd jfx-static-examples/example-render-check/target
          ./render-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check-${{ matrix.platform }}-graalvm${{ matrix.graalvm }}
          path: jfx-static-examples/example-render-check/target/render-check-*.png
          if-no-files-found: warn

  # One artifact with every snapshot, plus an index.html that shows them side by side. The job summary
  # cannot embed images, so the page is what to open after a download
  report:
    name: snapshot report
    runs-on: ubuntu-latest
    needs: render-check
    if: always()
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: render-check-*
          path: snapshots

      - name: write the index and the summary
        shell: bash
        run: |
          cd snapshots
          {
            echo '<!doctype html><meta charset="utf-8"><title>render check</title>'
            echo '<style>body{font-family:sans-serif} figure{display:inline-block;margin:1em} img{border:1px solid #ccc}</style>'
            for png in */render-check-*.png; do
              echo "<figure><img src=\"data:image/png;base64,$(base64 -w0 "$png")\"><figcaption>$png</figcaption></figure>"
            done
          } > index.html
          {
            echo '| job | snapshot | bytes |'
            echo '|---|---|---|'
            for png in */render-check-*.png; do
              echo "| ${png%%/*} | ${png#*/} | $(stat -c %s "$png") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: render-checks
          path: snapshots

  # Headless loads no glass native, so one job runs the windowed app. Linux is the only runner with a display (Xvfb)
  gtk-window:
    name: hellofx on glassgtk3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install the link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: build hellofx
        run: mvn -B -Pnative package -pl jfx-static-examples/example-hellofx -am

      # The app runs until closed, the timeout is the success path
      - name: show the window
        run: |
          cd jfx-static-examples/example-hellofx/target
          timeout 30 xvfb-run -a ./hellofx -Dprism.verbose=true | tee hellofx.log || true
          grep "Initialized prism pipeline" hellofx.log
