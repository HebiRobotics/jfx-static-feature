# Builds and runs the headless example on every platform. The windowed pipelines need a real
# session and stay a manual check.
name: render check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:

  render-check:
    name: ${{ matrix.platform }} on GraalVM ${{ matrix.graalvm }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022-8core
            platform: windows-x86_64
            graalvm: "25"
          - os: ubuntu-22.04-8core
            platform: linux-x86_64
            graalvm: "25"
          - os: ubuntu-22.04-arm-large
            platform: linux-aarch64
            graalvm: "25"
          - os: macos-15-intel
            platform: darwin-x86_64
            graalvm: "25.0.1" # last intel version, and checks for API compatibility
          - os: macos-latest
            platform: darwin-aarch64
            graalvm: "25"
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: ${{ matrix.graalvm }}
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The feature links the whole GTK stack even for a headless render
      - name: install the link dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: build the render check
        run: mvn -B -Pnative package -pl jfx-static-examples/example-render-check -am

      - name: run the render check
        shell: bash
        run: |
          cd jfx-static-examples/example-render-check/target
          ./render-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-check-${{ matrix.platform }}-graalvm${{ matrix.graalvm }}
          path: jfx-static-examples/example-render-check/target/render-check-*.png
          if-no-files-found: warn

  report:
    name: snapshot report
    runs-on: ubuntu-latest
    needs: render-check
    if: always()
    permissions:
      actions: write
    steps:
      # One artifact instead of one per job, the snapshots are named after host and configuration
      - uses: actions/upload-artifact/merge@v4
        with:
          name: render-checks
          pattern: render-check-*
          delete-merged: true

      - uses: actions/download-artifact@v4
        with:
          name: render-checks
          path: snapshots

      - name: write the index and the summary
        shell: python
        run: |
          import os, re
          stages = ['2d', '3d', 'titlebar', 'alert', 'popup', 'robot', 'richtext']
          rows = {}
          for name in sorted(os.listdir('snapshots')):
              m = re.match(r'render-check-(.+)-(\w+)\.png$', name)
              if m:
                  rows.setdefault(m.group(1), {})[m.group(2)] = name
          # One table, hosts and configurations down, scenarios across, so the platforms compare side by side
          html = ['<!doctype html><meta charset="utf-8"><title>render check</title>',
                  '<style>body{font-family:sans-serif;background:#eee;margin:1em} table{border-collapse:collapse}'
                  ' th,td{border:1px solid #bbb;padding:4px;text-align:center;background:#fff} th{background:#ddd}'
                  ' td.row{text-align:left;white-space:nowrap;font-size:13px} img{max-width:240px;max-height:180px}'
                  ' .skip{color:#999}</style>',
                  '<table><tr><th>configuration</th>' + ''.join(f'<th>{s}</th>' for s in stages) + '</tr>']
          summary = ['| configuration | ' + ' | '.join(stages) + ' |', '|---|' + '---|' * len(stages)]
          # GPU pipelines first and the real window before Headless, the hosts last, so the same
          # scenario on every platform sits in adjacent rows
          def order(config):
              host, pipeline, platform = config.rsplit('-', 2)
              return (pipeline == 'sw', platform == 'Headless', host)
          for config in sorted(rows, key=order):
              files = rows[config]
              html.append(f'<tr><td class="row">{config}</td>' + ''.join(
                  f'<td><a href="{files[s]}"><img src="{files[s]}"></a></td>' if s in files else '<td class="skip">skipped</td>'
                  for s in stages) + '</tr>')
              summary.append(f'| {config} | ' + ' | '.join(
                  str(os.path.getsize(os.path.join('snapshots', files[s]))) + ' B' if s in files else 'skipped'
                  for s in stages) + ' |')
          html.append('</table>')
          with open('snapshots/index.html', 'w') as f:
              f.write('\n'.join(html))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(summary) + '\n')

      - uses: actions/upload-artifact@v4
        with:
          name: render-checks
          path: snapshots
          overwrite: true

  # Headless loads no glass native, so one job runs the windowed app. Linux is the only runner with a display (Xvfb)
  gtk-window:
    name: hellofx on glassgtk3
    runs-on: ubuntu-22.04-8core
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: install the link dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxtst-dev libxxf86vm-dev libgl1-mesa-dev libpango1.0-dev xvfb

      - name: build hellofx
        run: mvn -B -Pnative package -pl jfx-static-examples/example-hellofx -am

      # The app runs until closed, the timeout is the success path
      - name: show the window
        run: |
          cd jfx-static-examples/example-hellofx/target
          timeout 30 xvfb-run -a ./hellofx -Dprism.verbose=true | tee hellofx.log || true
          grep "Initialized prism pipeline" hellofx.log
